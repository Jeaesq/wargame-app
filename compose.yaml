services:
  postgres:
    image: postgres:16-alpine
    container_name: wargame-postgres
    environment:
      POSTGRES_DB: wargame
      POSTGRES_USER: wargame
      POSTGRES_PASSWORD: wargame
    ports:
      - "5432:5432"
    volumes:
      - wargame-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wargame -d wargame"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wargame-postgres-data:
